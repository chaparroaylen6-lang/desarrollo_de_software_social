<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevCircles</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">
    <link href="css/variables.css" rel="stylesheet">
    <link href="css/base.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <link href="css/layout.css" rel="stylesheet">
    <link href="css/componentes.css" rel="stylesheet">
</head>
<body>
    <header>
        <div class="izquierda">
            <a href="#/feed" class="marca">
                <picture>
                    <!-- el logo claro es para fondo oscuro, y al reves -->
                    <source srcset="logo/logo-devcircles-claro.png" media="(prefers-color-scheme: dark)">
                    <img src="logo/logo-devcircles-oscuro.png" alt="DevCircles" class="logo">
                </picture>
            </a>
        </div>
        <div class="centro">
            <div class="barra-buscar">
                <i class="fa-solid texto-buscar fa-magnifying-glass"></i>
                <span class="texto-buscar">Buscar...</span>
            </div>
        </div>
        <div class="derecha">
            <nav-principal></nav-principal>
        </div>
    </header>
    <section class="area-principal">
        <aside class="barra-lateral">
            <h2 class="titulo-lateral">Etiquetas</h2>
            <div id="etiquetas" class="etiquetas">
                <p class="lateral-vacio">Cargando...</p>
            </div>
        </aside>
        <main id="app" class="contenido"></main>
    </section>
    <script type="module" src="js/main.js"></script>
</body>
</html>
